# Faq (Frequently asked questions) Settings
faq:
  enable: true
  faq_title: Questions? <em>Answers</em>. # You can add an 'em' element to highlight text.
  faq_description: A few things people often ask me, whether they're hiring or just starting out in data.

faq_items:
  - title: What do you actually do day to day?
    description: I'm a Business Intelligence Expert. I build dashboards and analysis used by thousands of people around the world, and I spend a lot of time working out what people really need before building anything. When a dashboard can't answer the question, I reach for data science, from forecasting to machine learning.

  - title: What kind of projects will I find here?
    description: A mix of the problems businesses face every day, solved with different tools. There's machine learning to predict delays and employee attrition, natural language processing on reviews and handling notes, forecasting for climate and warehouse volumes, clustering, a Streamlit app and a set of Tableau dashboards. Each project starts with the business question, shows how I approached it, and is honest about what worked and what didn't.

  - title: What kind of work excites you most?
    description: Building things that help people make better decisions, whether that's a model, a dashboard or the pipeline behind them. I'm especially drawn to work where data makes a positive difference, like sustainability and conservation. If that sounds like your world, I'd love to hear from you on LinkedIn or by email, using the links at the bottom of the page.

  - title: I'm new to data. Where should I start on this site?
    description: Pick any project and read its "At a glance" box first. In five lines it tells you the problem, the data, the approach, the result and the tools. Then follow the link to GitHub to see the code behind it. On the blog, Choosing Your Path in Data Science and Learning to Code, One Layer at a Time are good first reads.

  - title: Do I need a degree to work in data?
    description: Not to get started. I began as the person in the office who always ended up with the spreadsheets, taught myself SQL and Tableau through online courses, and then learned on the job through two apprenticeships, finishing with a data science degree. Curiosity and practice matter far more than where you start.

  - title: What's the biggest lesson you've learned?
    description: Be suspicious of results that look too good. One of my early models scored over 99% accuracy, and the reason turned out to be data leakage, with the answer hiding in the inputs. Checking that properly taught me more than any model ever did.

