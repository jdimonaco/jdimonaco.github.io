#-------------------------------
# Faq (Frequently asked questions) Settings
faq:
  enable: true
  faq_title: Questions? <em>Answers</em>. # You can add an 'em' element to highlight text.
  faq_description: Find solutions to common queries here.

faq_items:
  - title: What are your main areas of expertise?
    description: My core strengths are business intelligence and dashboard development, data analysis in SQL and Python, and applied data science, including forecasting, natural language processing and machine learning.

  - title: What type of projects do you showcase here?
    description: The portfolio features dashboards, analytical case studies, machine learning projects, and other data-focused work that demonstrates my technical and problem-solving abilities.

  - title: Do you have experience working with different data systems?
    description: Yes. I've worked with relational databases, Tableau, Python, and SAP Business Objects, and have experience analysing and integrating data across multiple platforms and teams.

  - title: What tools and technologies do you use?
    description: My day-to-day tools are SQL, Tableau and Python, with libraries such as pandas, scikit-learn, statsmodels, TensorFlow and Hugging Face Transformers for analysis and modelling. I also apply good engineering practice, such as modular code and version control, so my work can be rerun and reused.

  - title: How long does it take to complete a data or BI project?
    description:  Timelines depend on scope and complexity. Some dashboards or analyses can be delivered in a few days, while more advanced modelling, system design, or machine learning projects may take several weeks.

  - title: How can I contact you to discuss a project or opportunity?
    description: You can get in touch via the contact form or email. I’m always open to professional discussions, collaborations, and new opportunities.


